/* ---------- table rows (one record per row) ---------- */
var rowPending={},rowTimer=null;
function applyRows(){
  Object.keys(rowPending).forEach(function(id){
    var rs=rowPending[id];delete rowPending[id];
    S.rowData[id]=rs.docs.map(function(d){var o=d.data()||{};return {id:d.id,v:o.v||{},active:o.active!==false}});
  });
  Object.keys(S.tables).forEach(function(id){if(S.tables[id].big)S.tables[id].rows=S.rowData[id]||[]});
}
function schedRows(){
  if(rowTimer)return;
  rowTimer=setTimeout(function(){rowTimer=null;applyRows();render();syncDrawer()},180);
}

/* ---------- start ---------- */
(function init(){
  var h=location.hash.replace("#","");
  if(h==="tickets"||h==="dashboard"||h==="reference"||h==="executive")S.view=h;
  render();
  var timer=setTimeout(function(){if(!S.loaded){S.slow=true;render()}},10000);
  var c=window.claude;
  if(!c||!c.use){S.noStore=true;clearTimeout(timer);render();return}
  Promise.all([c.use("db"),c.use("user")]).then(async function(r){
    db=r[0];user=r[1];
    if(!db){S.noStore=true;clearTimeout(timer);render();return}
    if(user){
      try{
        var me=await user.me();S.me={id:me.id,name:me.name||"",email:me.email||""};
        if(me.id)S.names[me.id]=me.name||"";
        S.canEdit=await user.canEdit();
        var cw=await user.can("data.write");S.canWrite=cw!==false;
      }catch(e){}
    }
    S.meLoaded=true;
    render();
    loadSeen();
    db.collection("ref").onSnapshot(function(snap){
      var tabs={};
      snap.docs.forEach(function(d){var t=normTable(d.id,d.data());if(t)tabs[d.id]=t});
      S.tables=tabs;S.refLoaded=true;
      Object.keys(tabs).forEach(function(id){
        if(!tabs[id].big)return;
        if(!S.rowSubs[id])S.rowSubs[id]=db.collection("ref/"+id+"/rows").onSnapshot(function(rs){
          rowPending[id]=rs;
          S.rowsReady[id]=S.rowsReady[id]||!rs.metadata.fromCache||rs.size>0;
          schedRows();
        },function(){S.rowsReady[id]=true;schedRows()});
      });
      Object.keys(S.rowSubs).forEach(function(id){
        if(!tabs[id]||!tabs[id].big){S.rowSubs[id]();delete S.rowSubs[id];delete S.rowData[id];delete S.rowsReady[id];delete rowPending[id]}
      });
      applyRows();
      render();syncDrawer();
    },function(){S.refLoaded=true;render()});
    db.collection("tickets").onSnapshot(function(snap){
      S.tickets=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
      S.loaded=!snap.metadata.fromCache||snap.size>0;
      if(!snap.metadata.fromCache){clearTimeout(timer);S.slow=false}
      render();syncDrawer();
      ensureNames(S.tickets.reduce(function(a,t){a.push(t.reporter,t.lastBy);return a},[])).then(function(ch){if(ch){render();syncDrawer()}});
    },function(err){clearTimeout(timer);S.loadErr=(err&&err.code)||"unknown";render()});
  });
})();
})();
</script>
<script>
/* Issue Desk – Supabase adapter.
   Gives the app the same small db/user interface it used on claude.ai, backed by Supabase
   (table public.docs + Realtime + email sign-in). */
(function(){
"use strict";
var CFG=window.ISSUEDESK_CONFIG||{};
var $=function(s){return document.querySelector(s)};
var sb=null,access=null,session=null;

/* ---------- helpers ---------- */
function parentOf(p){var i=p.lastIndexOf("/");return i<0?"":p.slice(0,i)}
function idOf(p){return p.slice(p.lastIndexOf("/")+1)}
function rid(){
  var a=new Uint8Array(10);(window.crypto||window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2)}).join("").slice(0,16);
}
function wrapErr(e){
  var m=(e&&(e.message||e.details))||"error",code="unknown";
  if(/^not_allowed/.test(m)||/row-level security|permission denied/i.test(m))code="invalid_argument";
  else if(/^not_found/.test(m))code="not_found";
  else if(e&&(e.status===429||/too many|rate/i.test(m)))code="resource_exhausted";
  var o=new Error(m);o.code=code;o.cause=e;
  try{console.warn("[Issue Desk]",m)}catch(x){}
  return o;
}
async function ok(p){var r=await p;if(r&&r.error)throw wrapErr(r.error);return r}
function mkDoc(path,d){return {id:idOf(path),exists:true,data:function(){return d}}}

/* ---------- collection snapshots (initial fetch + realtime) ---------- */
var subs=[],chan=null,chanReady=false,wasSubscribed=false;
function ensureChannel(){
  if(chan)return;
  chan=sb.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:"docs"},onChange)
    .subscribe(function(status){
      if(status==="SUBSCRIBED"){
        chanReady=true;
        if(wasSubscribed)refetchAll();
        wasSubscribed=true;
      }
    });
}
function onChange(p){
  var rec=p.eventType==="DELETE"?p.old:p.new;
  if(!rec||!rec.path)return;
  var par=parentOf(rec.path);
  subs.forEach(function(s){
    if(s.path!==par)return;
    if(s.loading){s.queue.push(p);return}
    applyEvent(s,p);
  });
}
function applyEvent(s,p){
  if(p.eventType==="DELETE")s.map.delete(p.old.path);
  else s.map.set(p.new.path,p.new.data||{});
  schedule(s);
}
function schedule(s){
  if(s.timer)return;
  s.timer=setTimeout(function(){s.timer=null;emit(s)},40);
}
function emit(s){
  if(s.dead||s.loading)return;
  var arr=[];
  s.map.forEach(function(d,path){arr.push(mkDoc(path,JSON.parse(JSON.stringify(d))))});
  if(s.order){
    var f=s.order.f,dir=s.order.d==="desc"?-1:1;
    arr.sort(function(a,b){var x=a.data()[f],y=b.data()[f];return x===y?0:(x>y?1:-1)*dir});
  }else arr.sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0});
  s.cb({docs:arr,size:arr.length,empty:!arr.length,metadata:{fromCache:false,hasPendingWrites:false},
        forEach:function(fn){arr.forEach(fn)}});
}
async function fetchAll(path){
  var out=[],from=0,step=1000;
  for(;;){
    var r=await ok(sb.from("docs").select("path,data").eq("parent",path).order("path").range(from,from+step-1));
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  return out;
}
async function load(s){
  s.loading=true;s.queue=[];
  try{
    var rows=await fetchAll(s.path);
    s.map=new Map();rows.forEach(function(r){s.map.set(r.path,r.data||{})});
    s.loading=false;
    s.queue.forEach(function(p){applyEvent(s,p)});s.queue=[];
    emit(s);
  }catch(e){
    s.loading=false;
    if(s.err)s.err(wrapErr(e&&e.cause||e));
  }
}
function refetchAll(){subs.forEach(function(s){if(!s.dead)load(s)})}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){window.__hiddenAt=Date.now();return}
  if(window.__hiddenAt&&Date.now()-window.__hiddenAt>60000)refetchAll();
});

/* ---------- db ---------- */
function docRef(path){
  return {
    id:idOf(path),path:path,
    get:async function(){
      var r=await ok(sb.from("docs").select("data").eq("path",path).maybeSingle());
      return r.data?mkDoc(path,r.data.data||{}):{id:idOf(path),exists:false,data:function(){return undefined}};
    },
    set:async function(d){await ok(sb.from("docs").upsert({path:path,data:d},{onConflict:"path"}))},
    update:async function(patch){await ok(sb.rpc("doc_update",{p_path:path,p_patch:patch}))},
    delete:async function(){await ok(sb.from("docs").delete().eq("path",path))},
    acquire:async function(o){
      var r=await ok(sb.rpc("doc_acquire",{p_path:path,p_holder:String(o.holder),p_ttl_ms:o.ttlMs||1500}));
      return {acquired:r.data===true};
    },
    collection:function(n){return collRef(path+"/"+n)}
  };
}
function collRef(path,order){
  var q={
    path:path,
    doc:function(id){return docRef(path+"/"+(id||rid()))},
    add:async function(d){var r=docRef(path+"/"+rid());await r.set(d);return r},
    orderBy:function(f,d){return collRef(path,{f:f,d:d||"asc"})},
    get:async function(){
      var rows=await fetchAll(path),s={map:new Map(),order:order,cb:null};
      var arr=rows.map(function(r){return mkDoc(r.path,r.data||{})});
      if(order){var f=order.f,dir=order.d==="desc"?-1:1;arr.sort(function(a,b){var x=a.data()[f],y=b.data()[f];return x===y?0:(x>y?1:-1)*dir})}
      return {docs:arr,size:arr.length,empty:!arr.length,metadata:{fromCache:false},forEach:function(fn){arr.forEach(fn)}};
    },
    onSnapshot:function(cb,err){
      var s={path:path,order:order,cb:cb,err:err,map:new Map(),loading:true,queue:[],dead:false,timer:null};
      subs.push(s);ensureChannel();load(s);
      return function(){s.dead=true;var i=subs.indexOf(s);if(i>=0)subs.splice(i,1)};
    }
  };
  return q;
}
var db={
  collection:function(p){return collRef(p)},
  doc:function(p){return docRef(p)}
};

/* ---------- user ---------- */
var WRITE_ROLES={admin:1,helpdesk:1,technician:1};
function mkUser(){
  var name=null;
  return {
    me:async function(){
      return {id:access.uid,email:access.email,name:name!==null?name:(access.email||"").split("@")[0]};
    },
    canEdit:async function(){return !!access.owner},
    can:async function(){return !!(access.owner||WRITE_ROLES[access.role])},
    profiles:async function(ids){
      var out={};
      if(!ids||!ids.length)return out;
      var r=await ok(sb.from("profiles").select("id,name,email").in("id",ids));
      (r.data||[]).forEach(function(p){out[p.id]={name:p.name||(p.email||"").split("@")[0]}});
      return out;
    },
    _setName:function(n){name=n}
  };
}
async function teamNameFor(email){
  try{
    var r=await sb.from("docs").select("data").eq("path","ref/team").maybeSingle();
    var rows=(r.data&&r.data.data&&r.data.data.rows)||[];
    for(var i=0;i<rows.length;i++){
      var v=rows[i].v||{};
      if(String(v.email||"").trim().toLowerCase()===email&&v.name)return String(v.name);
    }
  }catch(e){}
  return "";
}

/* ---------- login screen ---------- */
function loginUI(){
  var el=$("#login");
  return {
    show:function(){el.hidden=false;document.body.classList.add("is-login")},
    hide:function(){el.hidden=true;document.body.classList.remove("is-login")},
    el:el
  };
}
function drawLogin(ui,state,msg){
  var h='<div class="lg-card"><div class="lg-brand">Issue Desk</div>';
  if(state==="setup"){
    h+='<h1>Setup needed</h1><p>Open <code>config.js</code> and fill in your Supabase project URL and anon key, then reload this page.</p>';
  }else if(state==="email"){
    h+='<h1>Sign in</h1><p>Enter your work email. We’ll send you a sign-in code and link.</p>'+
       '<form id="lgForm"><label for="lgEmail">Email</label><input id="lgEmail" type="email" autocomplete="email" inputmode="email" required placeholder="name@company.com">'+
       '<button class="lg-btn" type="submit">Send sign-in code</button></form>';
  }else if(state==="code"){
    h+='<h1>Check your email</h1><p>We sent a code to <b></b>. Enter it below, or click the link in the email on this device.</p>'+
       '<form id="lgForm"><label for="lgCode">Sign-in code</label><input id="lgCode" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10" required placeholder="123456">'+
       '<button class="lg-btn" type="submit">Sign in</button></form><button class="lg-link" id="lgBack" type="button">Use a different email</button>';
  }else if(state==="busy"){
    h+='<h1>Signing in…</h1><p>One moment.</p>';
  }
  if(msg)h+='<p class="lg-msg" role="alert"></p>';
  h+='</div>';
  ui.el.innerHTML=h;
  var b=ui.el.querySelector("p b");if(b)b.textContent=drawLogin.email||"";
  var m=ui.el.querySelector(".lg-msg");if(m)m.textContent=msg;
  var f=ui.el.querySelector("input");if(f)f.focus();
}
function askLogin(ui){
  return new Promise(function(resolve){
    var email="";
    function step1(msg){
      drawLogin(ui,"email",msg);
      $("#lgForm").onsubmit=async function(ev){
        ev.preventDefault();
        email=$("#lgEmail").value.trim().toLowerCase();
        var btn=ui.el.querySelector(".lg-btn");btn.disabled=true;btn.textContent="Sending…";
        var r=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
        if(r.error){step1(/rate|seconds|many/i.test(r.error.message)?"Too many requests. Wait a minute and try again.":"Couldn’t send the email: "+r.error.message);return}
        drawLogin.email=email;step2();
      };
    }
    function step2(msg){
      drawLogin(ui,"code",msg);
      $("#lgBack").onclick=function(){step1()};
      $("#lgForm").onsubmit=async function(ev){
        ev.preventDefault();
        var tok=$("#lgCode").value.replace(/\s+/g,"");
        var btn=ui.el.querySelector(".lg-btn");btn.disabled=true;btn.textContent="Checking…";
        var r=await sb.auth.verifyOtp({email:email,token:tok,type:"email"});
        if(r.error){step2("That code didn’t work. Check it and try again, or request a new one.");return}
        resolve(r.data&&r.data.session);
      };
    }
    step1();
    /* magic link opened in this same browser: the client picks the session up itself */
    sb.auth.onAuthStateChange(function(ev,s){if(s&&(ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED"))resolve(s)});
  });
}

/* ---------- boot ---------- */
async function boot(){
  var ui=loginUI();
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||/YOUR-PROJECT|YOUR_/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)){ui.show();drawLogin(ui,"setup");return}
  if(!window.supabase||!window.supabase.createClient){ui.show();drawLogin(ui,"setup","The sign-in library couldn’t be loaded. Check your connection.");return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"},
    realtime:{params:{eventsPerSecond:100}}
  });
  window.__sb=sb;
  ui.show();drawLogin(ui,"busy");
  var g=await sb.auth.getSession();
  session=g.data&&g.data.session;
  if(!session)session=await askLogin(ui);
  drawLogin(ui,"busy");
  var a=await sb.rpc("my_access");
  if(a.error||!a.data){
    ui.show();drawLogin(ui,"setup","Signed in, but the database isn’t ready (run 01-schema.sql in Supabase). "+((a.error&&a.error.message)||""));return;
  }
  access=a.data;
  var user=mkUser();
  if(access.role||access.owner){
    var nm=await teamNameFor(access.email);
    user._setName(nm||(access.email||"").split("@")[0]);
    try{await sb.rpc("touch_profile",{p_name:nm||(access.email||"").split("@")[0]})}catch(e){}
  }
  window.claude={use:async function(n){return n==="db"?db:n==="user"?user:null}};
  ui.hide();
  startApp();
  sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")location.reload()});
}
function startApp(){
  var code=document.getElementById("app").textContent;
  var s=document.createElement("script");s.textContent=code;document.body.appendChild(s);
  var tr=document.querySelector(".top-r");
  if(tr&&!document.getElementById("soBtn")){
    var b=document.createElement("button");b.className="btn";b.id="soBtn";b.type="button";b.textContent="Sign out";
    b.title=access.email||"";
    b.onclick=async function(){try{await sb.auth.signOut()}catch(e){}location.reload()};
    tr.appendChild(b);
  }
}
boot();
})();
</script>
</body></html>
