<!doctype html>
<html lang="en"><head>
<title>Issue Desk</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one shared workspace. Header with two views (Dashboard, Tickets) and a primary "New ticket" action.
   Dashboard = status tiles, then trend + attention list, then breakdowns, then recent activity.
   Tickets = filter toolbar over a flat list; a right-hand drawer holds details, updates and comments. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#ECEEF3; --line:#DCE0E8;
  --ink:#141922; --ink-2:#465061; --ink-3:#6B7586;
  --accent:#4437C9; --accent-ink:#FFFFFF; --accent-soft:#E7E5FB;
  --s-open:#2563D6; --s-prog:#A35D00; --s-hold:#5F6B7E; --s-done:#1B8756;
  --p-crit:#C62828; --p-high:#D9541E; --p-med:#465061; --p-low:#6B7586;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --surface:#171C26; --surface-2:#1F2531; --line:#2B3342;
    --ink:#EDF0F5; --ink-2:#B3BBC9; --ink-3:#8791A3;
    --accent:#9A91FF; --accent-ink:#12103A; --accent-soft:#25214F;
    --s-open:#6FA2FF; --s-prog:#F0B04A; --s-hold:#9EABBF; --s-done:#4CC38A;
    --p-crit:#FF7F77; --p-high:#FF9A62; --p-med:#B3BBC9; --p-low:#8791A3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C26; --surface-2:#1F2531; --line:#2B3342;
  --ink:#EDF0F5; --ink-2:#B3BBC9; --ink-3:#8791A3;
  --accent:#9A91FF; --accent-ink:#12103A; --accent-soft:#25214F;
  --s-open:#6FA2FF; --s-prog:#F0B04A; --s-hold:#9EABBF; --s-done:#4CC38A;
  --p-crit:#FF7F77; --p-high:#FF9A62; --p-med:#B3BBC9; --p-low:#8791A3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--f-display);letter-spacing:-.015em;color:var(--ink)}
.brand svg{color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;color:var(--ink-2);font-weight:500;padding:7px 16px;border-radius:8px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.bellp{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:64px;width:min(380px,calc(100% - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:25;padding:12px;display:flex;flex-direction:column;gap:8px}
.bellp[hidden],.nbar[hidden]{display:none}
.bellp h3{margin:0;font:600 14px var(--f-display)}
.bellp .bi{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bellp .bi .t{font-weight:600}.bellp .bi .m{font-size:12px;color:var(--ink-3)}
.nbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:12px;padding:10px 12px;z-index:29;max-width:calc(100% - 32px);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nbar a.btn{text-decoration:none;display:inline-flex}
.ro{font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.danger{color:var(--p-crit)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shared bits */
.pill{--c:var(--ink-2);display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.s-open{--c:var(--s-open)}.s-prog{--c:var(--s-prog)}.s-hold{--c:var(--s-hold)}.s-done{--c:var(--s-done)}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.sig i{width:3px;border-radius:1px;background:var(--line)}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:7px}.sig i:nth-child(3){height:10px}.sig i:nth-child(4){height:13px}
.p-low{--pc:var(--p-low)}.p-medium{--pc:var(--p-med)}.p-high{--pc:var(--p-high)}.p-critical{--pc:var(--p-crit)}
.sig i.on{background:var(--pc)}
.prio{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.od{color:var(--p-crit);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font:600 15px/1.2 var(--f-display);letter-spacing:-.005em}
.panel .hint{margin:0;color:var(--ink-3);font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{margin:0;font:700 18px var(--f-display)}
.empty p{margin:0;max-width:44ch;color:var(--ink-3)}

/* dashboard */
.tiles.x4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.tiles.x4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.xhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.xhead h2{margin:0;font:700 20px/1.2 var(--f-display)}
.xhead p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.xage{color:var(--p-high);font-weight:600;white-space:nowrap}
.tile.static{cursor:default}.tile.static:hover{border-color:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--ink-3)}
.t-l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.t-l .dot{width:8px;height:8px;border-radius:50%;background:var(--c,transparent)}
.t-n{font:700 38px/1.15 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-s{font-size:12.5px;color:var(--ink-3)}
.grid-a{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.grid-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.chart-scroll{overflow-x:auto}
.chart-scroll svg{display:block;min-width:520px;width:100%;height:auto}
.chart-scroll text{fill:var(--ink-3);font:11px var(--f-body);font-variant-numeric:tabular-nums}
.chart-scroll .gl{stroke:var(--line);stroke-width:1}
.chart-scroll .base{stroke:var(--ink-3);stroke-width:1}
.bar-r{fill:var(--accent)}.bar-c{fill:var(--s-done)}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font:700 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .fl{height:100%;background:var(--c,var(--accent));border-radius:4px;min-width:0}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbs{display:flex;flex-direction:column;gap:10px}
.lst{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;background:transparent;padding:10px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .ti{display:flex;flex-direction:column;min-width:0}
.item .ti b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ti span{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* tickets list */
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.toolbar input[type=search]{flex:1 1 240px;min-width:0}
.toolbar select{flex:0 1 auto;max-width:100%}
.in,.toolbar input,.toolbar select,.drawer input,.drawer select,.drawer textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.toolbar select,.toolbar .chk{width:auto}
.chk{display:inline-flex;align-items:center;gap:8px;padding:0 6px;color:var(--ink-2)}
.toolbar .chk input{width:auto;padding:0;border:0;background:transparent}
.count{color:var(--ink-3);font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:112px minmax(0,1fr) 118px 108px 140px;gap:14px;align-items:center;padding:11px 16px}
.lh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding-block:8px}
.row{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent}
.row:hover{background:var(--surface-2)}
.r-main{display:flex;flex-direction:column;min-width:0}
.r-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-who{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-who.none{color:var(--ink-3)}

/* reference data */
.refadd{display:flex;gap:8px}
.refadd input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.ri:first-child{border-top:0}
.ri .ti{display:flex;flex-direction:column;min-width:0}
.ri .ti b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ri .ti span{font-size:12.5px;color:var(--ink-3)}
.ri.off .ti b{color:var(--ink-3)}
.ri .btn{padding:5px 11px;font-weight:500}

.refwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:start}
.refnav{display:flex;flex-direction:column;gap:4px}
.rn{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:9px 12px;color:var(--ink-2);font-weight:500}
.rn small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.rn:hover{background:var(--surface-2)}
.rn.on{background:var(--surface);border-color:var(--line);color:var(--ink)}
.rn.add{color:var(--accent);font-weight:600}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph>div{min-width:0;flex:1 1 320px}
.tname{font:600 17px var(--f-display);border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;width:min(100%,360px)}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px;font-weight:500}
.chip button{border:0;background:transparent;min-width:22px;height:22px;border-radius:11px;color:var(--ink-3);font-size:14px;line-height:1;padding:0 5px}
.chip button:hover{background:var(--line);color:var(--ink)}
.radd{display:flex;gap:8px;flex-wrap:wrap}
.radd input{flex:1 1 130px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.rt{border-collapse:collapse;width:100%;min-width:480px}
.rt th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:8px 10px;white-space:nowrap}
.rt td{border-top:1px solid var(--line);padding:4px 6px}
.rt td:first-child input{min-width:150px}
.rt td input{width:100%;min-width:140px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px}
.rt td input:hover,.rt td input:focus{border-color:var(--line);background:var(--surface)}
.rt td input[readonly]{color:var(--ink-2)}
.rt td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);padding-inline:10px}
.rt td.ra{white-space:nowrap;text-align:right}
.rt tr.off td input{color:var(--ink-3)}
.rt .btn{padding:4px 10px;font-weight:500}
#impBox[hidden],#emailBox[hidden]{display:none!important}

.lg{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;margin:0;min-width:0;display:flex;flex-direction:column;gap:12px}
.lg legend{padding:0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lgnote{color:var(--ink-3);font-size:12px}
.drawer input[readonly]{background:var(--surface-2);color:var(--ink-2);cursor:default}

.searchbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.searchbar input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pager{display:flex;gap:14px;align-items:center;justify-content:center}
.upg{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.upg p{margin:0;flex:1 1 320px;min-width:0}

.cb{position:relative}
.cbl{position:absolute;z-index:6;left:0;width:calc(200% + 14px);top:100%;margin:4px 0 0;padding:4px;list-style:none;max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgb(0 0 0 / .22)}
.cbl li{display:flex;gap:10px;align-items:baseline;padding:7px 9px;border-radius:6px;cursor:pointer;min-width:0}
.cbl li.on{background:var(--accent-soft)}
.cbl li b{font:500 12.5px var(--f-mono);white-space:nowrap;color:var(--ink)}
.cbl li span{color:var(--ink-3);font-size:13px;font-weight:400;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cbl li.cbn{cursor:default;color:var(--ink-3);font-size:12.5px;font-weight:400;letter-spacing:0;display:block}

.drawer input.idf{background:var(--surface-2);color:var(--ink-2);font-family:var(--f-mono);cursor:default}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(10 14 22 / .5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font:700 17px var(--f-display)}
.x{border:0;background:transparent;width:32px;height:32px;border-radius:8px;font-size:22px;line-height:1;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}
.d-body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-2);min-width:0}
.fld small{font-weight:400;color:var(--ink-3);letter-spacing:0}
.fld .err{color:var(--p-crit);font-weight:500;letter-spacing:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.drawer textarea{resize:vertical;min-height:90px;line-height:1.5}
.drawer input[disabled],.drawer select[disabled],.drawer textarea[disabled]{opacity:.7}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:13px}
.meta dt{color:var(--ink-3)}.meta dd{margin:0;color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.sec h3{margin:0;font:600 14px var(--f-display)}
.thread{display:flex;flex-direction:column;gap:10px}
.sys{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--ink-3)}
.sys::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink-3);transform:translateY(-1px)}
.cm{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.cm header{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-3)}
.cm header b{color:var(--ink);font-weight:600}
.cm p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.row-end{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);font-weight:500}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles .tile:first-child{grid-column:1/-1}
  .grid-a,.grid-b{grid-template-columns:minmax(0,1fr)}
  .refwrap{grid-template-columns:minmax(0,1fr)}
  .refnav{flex-direction:row;flex-wrap:wrap}
}
@media (max-width:720px){
  .lh{display:none}
  .row{grid-template-columns:auto 1fr;grid-template-areas:"id st" "mn mn" "pr wh";gap:6px 12px;padding:12px 16px}
  .row .r-id{grid-area:id}.row .r-main{grid-area:mn}.row .r-st{grid-area:st;justify-self:end}
  .row .r-pri{grid-area:pr}.row .r-who{grid-area:wh;justify-self:end}
  .r-title{white-space:normal}
  .g2{grid-template-columns:minmax(0,1fr)}
  .cbl{width:100%}
  .top-r{margin-left:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
}
body.is-login .wrap,body.is-login #drawerRoot{display:none}

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="text/plain" id="app">
(function(){
"use strict";
var STATUSES=["Open","In Progress","On Hold","Closed"];
var PRIORITIES=["Low","Medium","High","Critical"];
var CATEGORIES=["Hardware","Software","Network","Access & accounts","Facilities","Other"];
var STCLS={"Open":"s-open","In Progress":"s-prog","On Hold":"s-hold","Closed":"s-done"};
var DAY=864e5;
var S={tickets:[],loaded:false,slow:false,noStore:false,loadErr:"",view:"dashboard",
  f:{q:"",status:"active",priority:"",category:"",assignee:"",mine:false,sort:"new",links:{}},
  open:null,thread:[],names:{},canWrite:true,canEdit:false,me:{id:null,name:"",email:""},role:"",seen:null,auth:"pending",meLoaded:false,refLoaded:false,who:{name:"",email:""},mounted:"",tables:{},refSel:"categories",rowData:{},rowSubs:{},rowsReady:{},rq:"",rpage:0,imp:null};
var db=null,user=null,unsubThread=null,lastFocus=null,toastTimer=null,busy=false;

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function sod(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function isActive(t){return t.status!=="Closed"}
var ID_PREFIX="E-LEARN-";
function fmtId(n){return ID_PREFIX+String(n).padStart(4,"0")}
function tid(t){return t.num?fmtId(t.num):ID_PREFIX+String(t.id).slice(-4).toUpperCase()}
function tsum(t){
  var s0=(t.title||"").trim();if(s0)return s0;
  var d=(t.description||"").trim().split(/\r?\n/)[0];
  return d?(d.length>110?d.slice(0,107)+"\u2026":d):"No description";
}
function fmtD(ts,yr){return new Date(ts).toLocaleDateString(undefined,yr?{day:"numeric",month:"short",year:"numeric"}:{day:"numeric",month:"short"})}
function ago(ts){
  var m=Math.round((Date.now()-ts)/6e4);
  if(m<1)return "just now"; if(m<60)return m+" min ago";
  var h=Math.round(m/60); if(h<24)return h+" h ago";
  var d=Math.round(h/24); if(d<8)return d+" d ago";
  return fmtD(ts,true);
}
function dur(ms){var h=ms/36e5; return h<36?Math.max(1,Math.round(h))+" h":(ms/DAY).toFixed(1)+" d"}
function nm(id,cap){var n=id?(id===S.me.id?"you":(S.names[id]||"a teammate")):"a teammate";return cap?n.charAt(0).toUpperCase()+n.slice(1):n}
function pill(st){return '<span class="pill '+(STCLS[st]||"")+'">'+esc(st)+'</span>'}
function sig(p){
  var n=PRIORITIES.indexOf(p)+1,h="";
  for(var i=0;i<4;i++)h+='<i'+(i<n?' class="on"':'')+'></i>';
  return '<span class="prio p-'+String(p).toLowerCase()+'"><span class="sig" aria-hidden="true">'+h+'</span>'+esc(p)+'</span>';
}
function opts(list,cur,blank){
  return (blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(x){return '<option'+(x===cur?' selected':'')+'>'+esc(x)+'</option>'}).join("");
}
function dueInfo(t){
  if(!t.due)return null;
  var d=new Date(t.due+"T00:00:00");
  return {txt:fmtD(d.getTime()),od:isActive(t)&&d.getTime()<sod(Date.now()),days:Math.round((sod(Date.now())-d.getTime())/DAY)};
}
function toast(msg,ms){
  var el=$("#toast");el.textContent=msg;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},ms||4200);
}
function writeError(e){
  var c=e&&e.code;
  if(c==="invalid_argument")toast("Your access doesn't allow changes. Your role doesn’t allow that action.");
  else if(c==="no_id")toast("Couldn't generate the ticket ID. Try again in a moment.");
  else if(c==="quota_exceeded")toast("The ticket store is full. Ask the owner to clear old tickets.");
  else toast("That didn't save. Check your connection and try again.");
}
function cur(){return S.tickets.find(function(t){return t.id===S.open})}
var DEF_TABLES={};
function slug(n){return String(n).toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}
DEF_TABLES.categories={key:"categories",sys:true,name:"Categories",fields:[{id:"name",label:"Name"}],link:false,order:0,
  rows:CATEGORIES.map(function(n){return {id:"c_"+slug(n),v:{name:n},active:true}})};
DEF_TABLES.team={key:"team",sys:true,name:"Team members",fields:[{id:"name",label:"Name"},{id:"email",label:"Email"},{id:"role",label:"Role"},{id:"notify",label:"Notify on new tickets"}],link:false,order:0,rows:[]};
function tbl(k){return S.tables[k]||DEF_TABLES[k]||null}
var ROLES=["Admin","Helpdesk","Technician","Observer"];
var ROLE_NOTE={admin:"Can do everything.",helpdesk:"Can raise tickets.",technician:"Can close tickets and fill in actions done.",observer:"Can view tickets only."};
function roleLabel(r){return r?r.charAt(0).toUpperCase()+r.slice(1):""}
function roleOf(row){var r=String((row&&row.v&&row.v.role)||"").toLowerCase();return ROLES.map(function(x){return x.toLowerCase()}).indexOf(r)>=0?r:""}
function resolveAuth(){
  if(!S.meLoaded||!S.refLoaded){S.auth="pending";return}
  var em=String(S.me.email||"").toLowerCase();
  var row=em?refRows("team").find(function(r){return r.active!==false&&String((r.v&&r.v.email)||"").toLowerCase()===em}):null;
  var rr=roleOf(row);
  if(S.canEdit){S.role="admin";S.auth="ok"}
  else if(!em){S.role="";S.auth="noemail"}
  else if(rr){S.role=rr;S.auth="ok"}
  else{S.role="";S.auth="denied"}
  S.who={name:(row&&rowName(row))||S.me.name||"",email:em};
}
function observerRecipients(){
  return refRows("team").filter(function(r){return r.active!==false&&roleOf(r)==="observer"&&String((r.v&&r.v.notify)||"")==="Yes"&&r.v&&r.v.email});
}
function iNotify(){
  if(S.auth!=="ok"||S.role!=="observer")return false;
  return observerRecipients().some(function(r){return String(r.v.email).toLowerCase()===S.who.email});
}
function newForMe(){
  if(!iNotify()||S.seen==null)return [];
  return S.tickets.filter(function(t){return (t.createdAt||0)>S.seen}).sort(function(a,b){return b.createdAt-a.createdAt});
}
function renderBell(){
  var b=$("#bellBtn"),pn=$("#bellPanel");if(!b)return;
  var on=iNotify()&&S.seen!=null;b.hidden=!on;
  if(!on){pn.hidden=true;return}
  var n=newForMe();$("#bellN").textContent=n.length;
  if(pn.hidden)return;
  pn.innerHTML='<h3>New tickets since you last checked</h3>'+(n.length?n.slice(0,30).map(function(t){
    return '<button class="bi" data-open="'+esc(t.id)+'"><span class="t">'+esc(tid(t))+' · '+esc(tsum(t))+'</span><span class="m">'+esc(t.priority||"")+' · '+esc(t.category||"")+' · raised '+ago(rsd(t))+' by '+esc(creatorName(t))+'</span></button>';
  }).join("")+(n.length>30?'<p class="hint">and '+(n.length-30)+' more</p>':'')+'<button class="btn" id="markSeen">Mark all as read</button>':'<p class="hint">Nothing new. You’ll see new tickets here when they are raised.</p>');
}
async function loadSeen(){
  var now=Date.now();
  if(!db||!S.me.id){S.seen=now;renderBell();return}
  try{
    var ref=db.doc("data/users/"+S.me.id+"/seen"),d=await ref.get();
    if(d.exists&&d.data().at)S.seen=d.data().at;
    else{S.seen=now;await ref.set({at:now})}
  }catch(e){S.seen=now}
  renderBell();
}
async function markSeen(){
  var now=Date.now();S.seen=now;renderBell();
  try{if(db&&S.me.id)await db.doc("data/users/"+S.me.id+"/seen").set({at:now})}catch(e){}
}
function nbarShow(label,desc,cat,pri,by){
  var rc=observerRecipients();if(!rc.length||!P("raise"))return;
  var em=rc.map(function(r){return String(r.v.email).toLowerCase()});
  var subj=label+" raised: "+String(desc).split("\n")[0].slice(0,80);
  var body=label+" has been raised.\n\nDescription: "+desc+"\nCategory: "+cat+"\nPriority: "+pri+"\nRaised by: "+by+"\n";
  var bar=$("#nbar");
  bar.innerHTML='<span><b>'+esc(label)+'</b> raised. Let '+em.length+' observer'+(em.length===1?'':'s')+' know?</span><a class="btn primary" target="_blank" rel="noopener" href="mailto:?bcc='+encodeURIComponent(em.join(","))+'&subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)+'">Email observers</a><button class="btn" id="nbCopy" data-em="'+esc(em.join(", "))+'">Copy addresses</button><button class="btn" id="nbX">Dismiss</button>';
  bar.hidden=false;clearTimeout(nbarShow.t);nbarShow.t=setTimeout(function(){bar.hidden=true},60000);
}
function isAdm(){return S.role==="admin"&&S.canWrite}
function P(a){
  if(!S.canWrite||S.auth!=="ok")return false;
  var r=S.role;
  if(r==="admin")return true;
  if(a==="raise")return r==="helpdesk";
  if(a==="close"||a==="actions")return r==="technician";
  if(a==="comment")return r==="helpdesk"||r==="technician";
  return false;
}
function patchAllowed(p){
  if(S.role==="admin")return true;
  if(S.role==="technician")return Object.keys(p).every(function(k){return ["status","closedAt","closedBy","actionsDone"].indexOf(k)>=0});
  return false;
}
function normTable(id,o){
  var sys=id==="categories"||id==="team",d=DEF_TABLES[id];
  if(Array.isArray(o.items)&&d){
    return {key:id,sys:true,name:d.name,fields:d.fields,link:false,order:0,rows:o.items.map(function(i){return {id:"c_"+slug(i.name),v:{name:i.name,email:i.email||"",role:i.role||"",notify:i.notify||""},active:i.active!==false}})};
  }
  if(o.kind!=="table")return null;
  var fields=Array.isArray(o.fields)&&o.fields.length?o.fields:(d?d.fields:[]);
  if(!fields.length)return null;
  if(id==="team"&&!fields.some(function(f){return f.id==="role"}))fields=fields.concat([{id:"role",label:"Role"}]);
  if(id==="team"&&!fields.some(function(f){return f.id==="notify"}))fields=fields.concat([{id:"notify",label:"Notify on new tickets"}]);
  return {key:id,sys:sys,name:o.name||(d&&d.name)||id,fields:fields,link:!!o.link&&!sys,order:o.order||0,big:o.store==="rows",
    rows:(o.store==="rows"||!Array.isArray(o.rows)?[]:o.rows).map(function(r){return {id:r.id,v:r.v||{},active:r.active!==false}})};
}
function rowName(r){return (r.v&&r.v.name)||""}
function refRows(k){var t=tbl(k);return t?t.rows:[]}
function activeNames(k,cur){
  var a=refRows(k).filter(function(r){return r.active!==false}).map(rowName).filter(Boolean);
  if(cur&&a.map(function(x){return x.toLowerCase()}).indexOf(String(cur).toLowerCase())<0)a.push(cur);
  return a;
}
function allNames(k,used){
  var m={};refRows(k).forEach(function(r){var n=rowName(r);if(n)m[n.toLowerCase()]=n});
  (used||[]).forEach(function(n){n=(n||"").trim();if(n&&!m[n.toLowerCase()])m[n.toLowerCase()]=n});
  return Object.keys(m).map(function(x){return m[x]}).sort(function(a,b){return a.localeCompare(b)});
}
function linkedTables(){
  return Object.keys(S.tables).map(function(k){return S.tables[k]}).filter(function(t){return !t.sys&&t.link})
    .sort(function(a,b){return (a.order||0)-(b.order||0)});
}
function rowLabel(t,r){
  var f=t.fields,a=(r.v&&r.v[f[0].id])||"",b=f[1]?((r.v&&r.v[f[1].id])||""):"";
  return b?a+" – "+b:a;
}
function rowIndex(t){
  if(t._ixr!==t.rows){t._ixr=t.rows;var m={};t.rows.forEach(function(r){m[r.id]=r});t._ix=m}
  return t._ix;
}
function linkLabel(t,l){
  var r=l&&rowIndex(t)[l.id];
  return r?rowLabel(t,r):((l&&l.label)||"");
}
function linkValues(tb,l){
  var r=l&&l.id?rowIndex(tb)[l.id]:null;
  return r?(r.v||{}):((l&&l.values)||{});
}
function linkOptions(tb,l){
  var f0=tb.fields[0].id,curId=(l&&l.id)||"",seen=false;
  var o='<option value="">'+(tb.big&&!S.rowsReady[tb.key]?'Loading\u2026':'Select '+esc(tb.fields[0].label.toLowerCase()))+'</option>';
  tb.rows.slice().sort(function(a,b){return String((a.v&&a.v[f0])||"").localeCompare(String((b.v&&b.v[f0])||""))}).forEach(function(r){
    if(r.active===false&&r.id!==curId)return;
    if(r.id===curId)seen=true;
    o+='<option value="'+esc(r.id)+'"'+(r.id===curId?' selected':'')+'>'+esc((r.v&&r.v[f0])||"")+'</option>';
  });
  if(curId&&!seen)o+='<option value="'+esc(curId)+'" selected>'+esc((l.values&&l.values[f0])||l.label||"Unknown")+'</option>';
  return o;
}
function linkSelects(prefix,t,dis){
  return linkedTables().map(function(tb){
    var l=(t&&t.links&&t.links[tb.key])||{},vals=linkValues(tb,l),f0=tb.fields[0];
    var req=prefix==="n"&&(tb.rows.some(function(r){return r.active!==false})||(tb.big&&!S.rowsReady[tb.key]));
    return '<fieldset class="lg"><legend>'+esc(tb.name)+'</legend><div class="g2">'+
      '<div class="fld"><label for="'+prefix+'Q-'+tb.key+'">'+esc(f0.label)+'</label>'+comboHTML(prefix,tb,l,dis)+'<select hidden id="'+prefix+'L-'+tb.key+'" data-'+(prefix==="n"?"nl":"dl")+'="'+tb.key+'"'+(req?' data-req="1"':'')+(dis||"")+'>'+linkOptions(tb,l)+'</select><span class="err" id="'+prefix+'Le-'+tb.key+'" hidden>Choose a '+esc(f0.label.toLowerCase())+'.</span></div>'+
      tb.fields.slice(1).map(function(f){
        return '<label class="fld">'+esc(f.label)+'<input readonly id="'+prefix+'F-'+tb.key+'-'+f.id+'" value="'+esc(vals[f.id]||"")+'" placeholder="Filled in automatically"></label>';
      }).join("")+
      '</div><small class="lgnote">Everything except '+esc(f0.label.toLowerCase())+' is filled in from the '+esc(tb.name)+' reference table.</small></fieldset>';
  }).join("");
}
function rowValues(tb,rowId){
  var r=tb.rows.find(function(x){return x.id===rowId}),v={};
  tb.fields.forEach(function(f){v[f.id]=(r&&r.v&&r.v[f.id])||""});
  return v;
}
function fillLinked(prefix,key,rowId){
  var tb=S.tables[key];if(!tb)return;
  var v=rowValues(tb,rowId);
  tb.fields.slice(1).forEach(function(f){var el=document.getElementById(prefix+"F-"+key+"-"+f.id);if(el)el.value=v[f.id]});
}
function collectLinks(){
  var o={};
  document.querySelectorAll("[data-nl]").forEach(function(el){
    var tb=S.tables[el.dataset.nl];if(!tb||!el.value)return;
    var r=tb.rows.find(function(x){return x.id===el.value});
    o[tb.key]={id:el.value,label:r?rowLabel(tb,r):"",values:rowValues(tb,el.value)};
  });
  return o;
}

/* ---------- names ---------- */
function ensureNames(ids){
  if(!user)return Promise.resolve(false);
  var miss=[];ids.forEach(function(i){if(i&&i!==S.me.id&&!(i in S.names)&&miss.indexOf(i)<0)miss.push(i)});
  if(!miss.length)return Promise.resolve(false);
  return user.profiles(miss).then(function(ps){miss.forEach(function(i){S.names[i]=(ps[i]&&ps[i].name)||""});return true},
    function(){miss.forEach(function(i){S.names[i]=""});return true});
}

/* ---------- top-level render ---------- */
function render(){
  resolveAuth();
  syncTeamList();
  document.querySelectorAll(".tab").forEach(function(b){
    if(b.dataset.view===S.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
  if(S.view==="reference"&&!(S.canEdit&&S.auth==="ok"))S.view="dashboard";
  $("#refTab").hidden=!(S.canEdit&&S.auth==="ok");
  document.querySelectorAll('.tab[data-view="dashboard"],.tab[data-view="tickets"],.tab[data-view="executive"]').forEach(function(b){b.hidden=S.auth!=="ok"});
  document.querySelectorAll(".tab").forEach(function(b){
    if(b.dataset.view===S.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
  $("#newBtn").hidden=!P("raise");
  var rn=$("#roNote");rn.hidden=S.auth!=="ok";
  rn.textContent=roleLabel(S.role)+(S.canWrite?"":" · view only");
  renderBell();
  rn.title=(S.who.email||S.me.name||"")+" — "+(ROLE_NOTE[S.role]||"");
  renderMain();
}
function renderMain(){
  var main=$("#main");
  if(S.noStore||S.loadErr){
    S.mounted="";
    main.innerHTML='<div class="panel"><div class="empty"><h2>Tickets can’t be loaded here</h2><p>'+(S.noStore?"Shared storage isn’t available in this view. Open the page from its link while signed in.":"The ticket store returned an error ("+esc(S.loadErr)+"). Reload the page to try again.")+'</p></div></div>';
    return;
  }
  if(S.auth==="pending"){
    S.mounted="";
    main.innerHTML='<div class="panel"><div class="empty"><h2>Checking your access…</h2><p>Matching your sign-in email to the user list.</p></div></div>';
    return;
  }
  if(S.auth==="noemail"||S.auth==="denied"){
    S.mounted="";if(S.open)closeDrawer();
    main.innerHTML='<div class="panel"><div class="empty"><h2>You don’t have access to Issue Desk</h2><p>'+(S.auth==="noemail"?"Your sign-in email isn’t available to this page, so your role can’t be checked. Ask the owner to confirm that email sharing is allowed for this page, or open it while signed in with your work account.":"Your email"+(S.who.email?" ("+esc(S.who.email)+")":"")+" isn’t on the user list, or has no role assigned. Ask an administrator to add it in Reference data → Team members.")+'</p></div></div>';
    return;
  }
  if(!S.loaded){
    S.mounted="";
    main.innerHTML='<div class="panel"><div class="empty"><h2>Loading tickets…</h2><p>'+(S.slow?"The ticket store isn’t answering yet. Check your connection; the page will fill in when it does.":"Fetching the latest from your team.")+'</p></div></div>';
    return;
  }
  if(S.view==="dashboard"){S.mounted="dashboard";main.innerHTML=dashHTML();}
  else if(S.view==="executive"){S.mounted="executive";main.innerHTML=execHTML();}
  else if(S.view==="reference")mountReference();
  else mountTickets();
}

/* ---------- dashboard ---------- */
function hbars(rows,max){
  if(!rows.length)return '<p class="hint">Nothing open.</p>';
  var m=max||Math.max.apply(null,rows.map(function(r){return r.n}).concat([1]));
  return '<div class="hbs">'+rows.map(function(r){
    return '<div class="hb"><span class="lb" title="'+esc(r.label)+'">'+esc(r.label)+'</span><span class="tr"><span class="fl" style="display:block;width:'+(r.n/m*100)+'%;'+(r.color?'--c:'+r.color:'')+'"></span></span><span class="n">'+r.n+'</span></div>';
  }).join("")+'</div>';
}
function chartSVG(days){
  var W=640,H=230,L=30,R=6,T=10,B=28,pw=W-L-R,ph=H-T-B;
  var mx=Math.max.apply(null,[1].concat(days.map(function(d){return Math.max(d.r,d.c)})));
  var step=mx<=5?1:Math.ceil(mx/4),top=Math.ceil(mx/step)*step;
  function y(v){return T+ph-(v/top)*ph}
  var g="",v,gw=pw/days.length,bw=Math.min(14,gw*0.32);
  for(v=0;v<=top;v+=step){g+='<line class="'+(v===0?'base':'gl')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  var totR=0,totC=0;
  days.forEach(function(d,i){
    var cx=L+gw*i+gw/2,lab=d.date.toLocaleDateString(undefined,{day:"numeric",month:"short"});
    totR+=d.r;totC+=d.c;
    if(d.r)g+='<rect class="bar-r" x="'+(cx-bw-1)+'" y="'+y(d.r)+'" width="'+bw+'" height="'+(y(0)-y(d.r))+'" rx="2"><title>'+lab+': '+d.r+' raised</title></rect>';
    if(d.c)g+='<rect class="bar-c" x="'+(cx+1)+'" y="'+y(d.c)+'" width="'+bw+'" height="'+(y(0)-y(d.c))+'" rx="2"><title>'+lab+': '+d.c+' closed</title></rect>';
    if((days.length-1-i)%2===0)g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+(i===days.length-1?"Today":lab)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tickets raised and closed per day over the last 14 days: '+totR+' raised, '+totC+' closed">'+g+'</svg>';
}
function dashHTML(){

    return '<div class="panel"><div class="empty"><h2>No tickets yet</h2><p>This dashboard fills in as your team raises tickets. Counts, trends and ageing appear here automatically.</p>'+(P("raise")?'<button class="btn primary" data-new>Raise the first ticket</button>':'')+'</div></div>';
  }

  function cnt(s){return T.filter(function(t){return t.status===s}).length}
  var wk=now-7*DAY,

  T.forEach(function(t){

  var closedT=T.filter(function(t){return t.closedAt&&rsd(t)&&t.closedAt>=rsd(t)});
  var avg=closedT.length?dur(closedT.reduce(function(s,t){return s+(t.closedAt-rsd(t))},0)/closedT.length):"—";
  var attn=act.filter(function(t){var di=dueInfo(t);return (di&&di.od)||PRIORITIES.indexOf(t.priority)>=2})
    .sort(function(a,b){return PRIORITIES.indexOf(b.priority)-PRIORITIES.indexOf(a.priority)||rsd(a)-rsd(b)}).slice(0,6);
  var attnHTML=attn.length?'<div class="lst">'+attn.map(function(t){
    var di=dueInfo(t),tag=di&&di.od?'<span class="od">Overdue '+di.days+' d</span>':sig(t.priority);
    return '<button class="item" data-open="'+esc(t.id)+'"><span class="mono">'+tid(t)+'</span><span class="ti"><b>'+esc(tsum(t))+'</b><span>'+esc(t.assignee||"Unassigned")+' · '+pillText(t.status)+'</span></span>'+tag+'</button>';
  }).join("")+'</div>':'<p class="hint">Nothing is overdue and no high or critical tickets are open.</p>';
  var attention='<section class="panel"><h2>Needs attention</h2><div class="stats">'+
    '<div class="stat"><b>'+overdue.length+'</b><span>overdue</span></div>'+
    '<div class="stat"><b>'+avg+'</b><span>average time to close</span></div></div>'+attnHTML+'</section>';

  var prRows=PRIORITIES.slice().reverse().map(function(p){
    return {label:p,n:act.filter(function(t){return t.priority===p}).length,color:{Critical:"var(--p-crit)",High:"var(--p-high)",Medium:"var(--p-med)",Low:"var(--p-low)"}[p]};
  });
  var buckets=[["Under 1 day",0,1],["1–3 days",1,4],["4–7 days",4,8],["1–2 weeks",8,15],["Over 2 weeks",15,1e9]];
  var ageRows=buckets.map(function(b){
    return {label:b[0],n:act.filter(function(t){var a=(now-rsd(t))/DAY;return a>=b[1]&&a<b[2]}).length,color:b[1]>=8?"var(--p-high)":"var(--accent)"};
  });
  function group(fn,labelFn){
    var m={};act.forEach(function(t){var k=fn(t);m[k]=(m[k]||0)+1});
    return Object.keys(m).map(function(k){return {label:labelFn?labelFn(k):k,n:m[k]}}).sort(function(a,b){return b.n-a.n}).slice(0,8);
  }
  var catRows=group(function(t){return t.category||"Other"});
  var whoRows=group(function(t){return (t.assignee||"").trim()||"Unassigned"});
  var br='<div class="grid-b">'+

    '<section class="panel"><h2>Open by category</h2>'+hbars(catRows)+'</section>'+
    '<section class="panel"><h2>Open by assignee</h2>'+hbars(whoRows)+'</section>'+linkPanels(act)+'</div>';

  var rec=T.slice().sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0)}).slice(0,8);
  var recent='<section class="panel"><h2>Recent activity</h2><div class="lst">'+rec.map(function(t){
    return '<button class="item" data-open="'+esc(t.id)+'"><span class="mono">'+tid(t)+'</span><span class="ti"><b>'+esc(tsum(t))+'</b><span>'+esc(t.lastEvent||"Raised")+' · '+esc(nm(t.lastBy))+'</span></span><time>'+ago(t.updatedAt||t.createdAt)+'</time></button>';
  }).join("")+'</div></section>';

  return '<div style="display:flex;flex-direction:column;gap:12px">'+tiles+'<div class="grid-a">'+trend+attention+'</div>'+br+recent+'</div>';

var XP=[["all","All time"],["7","Last 7 days"],["30","Last 30 days"],["90","Last 90 days"],["month","This month"],["year","This year"]];
function xStart(k){
  var d=new Date();
  if(k==="all")return 0;
  if(k==="month")return new Date(d.getFullYear(),d.getMonth(),1).getTime();
  if(k==="year")return new Date(d.getFullYear(),0,1).getTime();
  return sod(Date.now())-(parseInt(k,10)-1)*DAY;
}
function ageText(ms){
  var h=Math.floor(ms/36e5),d=Math.floor(h/24);
  return d>=1?d+" d "+(h%24)+" h":h+" h";
}
function execHTML(){

  function c(s){return open.filter(function(t){return t.status===s}).length}
  function tile(label,n,sub,cls){return '<div class="tile static"><span class="t-l"><i class="dot" style="'+(cls?'--c:var(--'+cls+')':'')+'"></i>'+label+'</span><span class="t-n">'+n.toLocaleString()+'</span><span class="t-s">'+sub+'</span></div>'}
  var plab=XP.filter(function(x){return x[0]===per})[0][1];
  var head='<div class="xhead"><div><h2>Executive summary</h2><p>'+esc(plab)+' · by date raised · as of '+fmtDT(now)+'</p></div>'+
    '<label class="fld" style="min-width:170px"><span class="sr">Reporting period</span><select id="xPeriod" aria-label="Reporting period">'+XP.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===per?' selected':'')+'>'+x[1]+'</option>'}).join("")+'</select></label></div>';
  var tiles='<div class="tiles x4">'+
    tile("Tickets created",T.length,"raised in this period","accent")+
    tile("Open",open.length,c("Open")+" new · "+c("In Progress")+" in progress · "+c("On Hold")+" on hold","s-open")+
    tile("Closed",closed.length,(T.length?Math.round(closed.length/T.length*100):0)+"% of created","s-done")+
    tile("Ageing 72 h or more",aged.length,aged.length?"oldest open "+ageText(now-rsd(aged[0])):"none of the open tickets","p-high")+
  '</div>';
  var bk=[["3 to 7 days",3,8],["1 to 2 weeks",8,15],["Over 2 weeks",15,1e9]];
  var rows=bk.map(function(b){return {label:b[0],n:aged.filter(function(t){var a=(now-rsd(t))/DAY;return a>=b[1]&&a<b[2]}).length,color:b[1]>=8?"var(--p-high)":"var(--accent)"}});
  var list=aged.length?'<div class="lst">'+aged.slice(0,50).map(function(t){
    return '<button class="item" data-open="'+esc(t.id)+'"><span class="mono">'+tid(t)+'</span><span class="ti"><b>'+esc(tsum(t))+'</b><span>'+esc(t.assignee||"Unassigned")+' · '+esc(t.status)+' · '+esc(t.priority||"")+'</span></span><span class="xage">'+ageText(now-rsd(t))+'</span></button>';
  }).join("")+'</div>'+(aged.length>50?'<p class="hint">Showing the 50 oldest of '+aged.length+'.</p>':''):'<p class="hint">No open ticket has been waiting 72 hours or more.</p>';
  var ageing='<div class="grid-a"><section class="panel"><h2>Ageing tickets, 72 hours or more</h2><p class="hint">Open, in progress or on hold, counted from the raised date and time to now. Oldest first.</p>'+list+'</section>'+
    '<section class="panel"><h2>How old they are</h2>'+hbars(rows)+'</section></div>';
  return '<div style="display:flex;flex-direction:column;gap:12px">'+head+tiles+ageing+'</div>';

function pillText(st){return esc(st)}
function groupRows(g){
  return Object.keys(g).map(function(k){return {label:k,n:g[k]}}).sort(function(a,b){return b.n-a.n}).slice(0,8);

function linkPanels(act){
  var out="",n=0;

function filtered(){
  var f=S.f,q=f.q.trim().toLowerCase();
  var out=S.tickets.filter(function(t){
    if(f.status==="active"&&!isActive(t))return false;
    if(f.status!=="active"&&f.status!=="all"&&t.status!==f.status)return false;
    if(f.priority&&t.priority!==f.priority)return false;
    if(f.category&&t.category!==f.category)return false;
    if(f.assignee==="__none"&&(t.assignee||"").trim())return false;
    if(f.assignee&&f.assignee!=="__none"&&(t.assignee||"").trim().toLowerCase()!==f.assignee.toLowerCase())return false;
    if(f.mine&&t.reporter!==S.me.id)return false;
    var lk=Object.keys(f.links||{});
    for(var li=0;li<lk.length;li++){
      var want=f.links[lk[li]];if(!want)continue;
      var lo=t.links&&t.links[lk[li]],has=lo&&lo.id;
      if(want==="__none"?has:(!has||lo.id!==want))return false;
    }
    if(q&&((t.title||"")+" "+(t.description||"")+" "+tid(t)+" "+linkText(t)+" "+peopleText(t)+" "+(t.actionsDone||"")).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  out.sort(function(a,b){
    if(f.sort==="upd")return (b.updatedAt||0)-(a.updatedAt||0);
    if(f.sort==="pri")return PRIORITIES.indexOf(b.priority)-PRIORITIES.indexOf(a.priority)||rsd(b)-rsd(a);
    if(f.sort==="due"){var x=a.due||"9999",y=b.due||"9999";return x<y?-1:x>y?1:rsd(b)-rsd(a)}
    return rsd(b)-rsd(a);
  });
  return out;
}

/* ---------- times, people and duration ---------- */
function rsd(t){return t.raisedAt||t.createdAt}
function pad2(n){return String(n).padStart(2,"0")}
function toLocalInput(ms){
  if(!ms)return "";
  var d=new Date(ms);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function fromLocalInput(v){
  if(!v)return null;
  var ms=new Date(v).getTime();
  return isNaN(ms)?null:ms;
}
function sameMin(a,b){return Math.floor(a/60000)===Math.floor(b/60000)}
function fmtDT(ms){
  return ms?new Date(ms).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
}
function durMin(t){
  var s=rsd(t);if(!s)return null;
  return Math.max(0,Math.round(((t.closedAt||Date.now())-s)/60000));
}
function durHuman(m){
  var d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60,p=[];
  if(d)p.push(d+" d");if(h)p.push(h+" h");if(n||!p.length)p.push(n+" min");
  return p.join(" ");
}
function durNote(t){
  var m=durMin(t);if(m===null)return "";
  return (t.closedAt?"":"Still open, counted up to now. ")+durHuman(m);
}
function validEmail(v){return !v||EMAIL.test(v)}
function creatorName(t){return (t.createdBy&&t.createdBy.name)||S.names[t.reporter]||nm(t.reporter)}
function peopleText(t){
  return [t.createdBy&&t.createdBy.name,t.createdBy&&t.createdBy.email,t.assignee,t.assigneeEmail,t.closedBy&&t.closedBy.name,t.closedBy&&t.closedBy.email].filter(Boolean).join(" ");
}
function teamMember(name){
  var n=String(name||"").trim().toLowerCase();if(!n)return null;
  return refRows("team").find(function(r){return r.active!==false&&rowName(r).toLowerCase()===n})||null;
}

  }).join(""));
}

function updDetailDur(t){
  var el=$("#dDur"),h=$("#dDurH");if(!el)return;
  var m=durMin(t);
  el.value=m===null?"":m.toLocaleString()+" min";
  h.textContent=durNote(t);

function openDrawer(id){lastFocus=document.activeElement;S.open=id;S.thread=[];renderDrawer()}
function closeDrawer(){
  if(unsubThread){unsubThread();unsubThread=null}
  S.open=null;$("#drawerRoot").innerHTML="";
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(e){}}
}
function roleNew(){
  if(isAdm())return;
  ["nClosed","nCloseName","nCloseEmail","nDur","nActions"].forEach(function(i){var e=$("#"+i),l=e&&e.closest("label");if(l)l.style.display="none"});
}
function renderDrawer(){
  var root=$("#drawerRoot");
  if(unsubThread){unsubThread();unsubThread=null}
  if(S.open==="new"){root.innerHTML=newHTML();roleNew();updNewDur();var f=$("#nDesc");if(f)f.focus();return}
  var t=cur();if(!t){closeDrawer();return}
  root.innerHTML=ticketHTML(t);
  var x=$(".x",root);if(x)x.focus();
  if(db){
    unsubThread=db.collection("tickets/"+t.id+"/activity").orderBy("at","asc").onSnapshot(function(snap){
      S.thread=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
      renderThread();
      ensureNames(S.thread.map(function(e){return e.by})).then(function(ch){if(ch)renderThread()});
    },function(){var th=$("#thread");if(th)th.innerHTML='<span class="sys">Updates couldn’t be loaded.</span>'});
  }
}
function renderThread(){
  var th=$("#thread");if(!th)return;
  if(!S.thread.length){th.innerHTML='<span class="sys">No updates yet.</span>';return}
  th.innerHTML=S.thread.map(function(e){
    if(e.kind==="comment")return '<div class="cm"><header><b>'+esc(nm(e.by,true))+'</b><span>'+ago(e.at)+'</span></header><p>'+esc(e.text)+'</p></div>';
    return '<div class="sys"><span>'+esc(nm(e.by,true))+' · '+esc(e.text)+' · '+ago(e.at)+'</span></div>';
  }).join("");
}
function syncText(id,val){
  var el=$("#"+id);if(!el)return;
  if(el.value===val)el.dataset.orig=val;
  else if(el.value===el.dataset.orig){el.value=val;el.dataset.orig=val}
}
function updateSave(){
  var b=$("#dSave");if(!b)return;
  var c=$("#dDesc"),a=$("#dActions");
  b.disabled=!(c.value!==c.dataset.orig||(a&&a.value!==a.dataset.orig));
}
function syncDrawer(){
  if(!S.open||S.open==="new")return;
  var t=cur();
  if(!t){closeDrawer();toast("That ticket was deleted.");return}
  var ae=document.activeElement;
  function set(id,v){var el=$("#"+id);if(el&&el!==ae&&el.value!==v)el.value=v}
  set("dStatus",t.status);set("dPriority",t.priority);
  function pick(id,k,v,blank){
    var el=$("#"+id);if(!el||el===ae)return;
    var html=opts(activeNames(k,v),v,blank);
    if(el.dataset.h!==html||el.value!==v){el.innerHTML=html;el.dataset.h=html;el.value=v}
  }
  pick("dCategory","categories",t.category||"");set("dDue",t.due||"");
  var cbk=t.createdBy||{};
  set("dAssignee",t.assignee||"");set("dAssigneeEmail",t.assigneeEmail||"");
  set("dRaised",toLocalInput(rsd(t)));set("dEndorsed",toLocalInput(t.endorsedAt));set("dClosed",toLocalInput(t.closedAt));
  var cl=t.closedBy||{};set("dCloseName",cl.name||"");set("dCloseEmail",cl.email||"");
  ["dCloseName","dCloseEmail"].forEach(function(i){var e=$("#"+i);if(e)e.disabled=!(isAdm()&&t.closedAt)});
  var dsb=$("#dStatus");if(dsb)dsb.disabled=!P("close");var dcl=$("#dClosed");if(dcl)dcl.disabled=!P("close");
  set("dByName",cbk.name||S.names[t.reporter]||"");set("dByEmail",cbk.email||"");
  updDetailDur(t);
  linkedTables().forEach(function(tb){
    var el=$("#dL-"+tb.key);if(!el)return;
    var l=(t.links&&t.links[tb.key])||{},html=linkOptions(tb,l);
    if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html}
    cbSync("d",tb,l);
  });
  linkedTables().forEach(function(tb){
    var vals=linkValues(tb,(t.links&&t.links[tb.key])||{});
    tb.fields.slice(1).forEach(function(f){var i=document.getElementById("dF-"+tb.key+"-"+f.id);if(i)i.value=vals[f.id]||""});
  });
  syncText("dDesc",t.description||"");syncText("dActions",t.actionsDone||"");updateSave();
  var m=$("#dMeta");if(m)m.innerHTML=metaHTML(t);
}

/* ---------- reference data ---------- */
var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
var PAGE=100,COLL=new Intl.Collator(),uidN=0;
function uid(p){return p+Date.now().toString(36)+(uidN++).toString(36)+Math.random().toString(36).slice(2,5)}
function isBig(t){return !!(t&&t.big)}
function rowDoc(key,id){return db.doc("ref/"+key+"/rows/"+id)}
function tableList(){
  var out=[tbl("categories"),tbl("team")];
  Object.keys(S.tables).filter(function(k){return !S.tables[k].sys}).sort(function(a,b){return (S.tables[a].order||0)-(S.tables[b].order||0)}).forEach(function(k){out.push(S.tables[k])});
  return out;
}
function usageMap(t){
  var m={};
  S.tickets.forEach(function(x){
    var k;
    if(t.key==="categories")k=String(x.category||"").toLowerCase();
    else if(t.key==="team")k=String(x.assignee||"").trim().toLowerCase();
    else{var l=x.links&&x.links[t.key];k=l&&l.id}
    if(k)m[k]=(m[k]||0)+1;
  });
  return m;
}
function rowUsage(t,r,um){
  um=um||usageMap(t);
  return um[(t.key==="categories"||t.key==="team")?rowName(r).toLowerCase():r.id]||0;
}
function refHint(t){
  if(t.key==="categories")return "The categories people can choose when raising a ticket. Retire one to hide it from new tickets; existing tickets keep it.";
  if(t.key==="team")return "People tickets can be assigned to. Adding an email here does not give someone access to this page: share the page with them from the Share menu (Copy emails helps with that).";
  return "A reference table. Rows can be pasted from a spreadsheet. Turn on the ticket option and people pick only the first field; the rest fill in from this table.";
}
function dupFirst(t,val,exceptId){
  var f=t.fields[0].id,v=String(val).toLowerCase();
  return t.rows.some(function(r){return r.id!==exceptId&&String((r.v&&r.v[f])||"").trim().toLowerCase()===v});
}
function notifyOpts(cur){return '<option value=""'+(cur==="Yes"?'':' selected')+'>No</option><option'+(cur==="Yes"?' selected':'')+'>Yes</option>'}
function roleOpts(cur){
  return '<option value=""'+(cur?'':' selected')+'>No access</option>'+ROLES.map(function(r){return '<option'+(r.toLowerCase()===String(cur).toLowerCase()?' selected':'')+'>'+r+'</option>'}).join("");
}
function emailTaken(t,email,exceptId){
  return t.rows.some(function(r){return r.id!==exceptId&&String((r.v&&r.v.email)||"").toLowerCase()===email});
}
function mountReference(){
  if(S.mounted!=="reference"){
    $("#main").innerHTML='<div class="refwrap"><nav class="refnav" id="refNav" aria-label="Reference tables"></nav><section class="panel" id="refPane"></section></div>';
    S.mounted="reference";
  }
  renderRefNav();renderRefPane();
}
function renderRefNav(){
  var nav=$("#refNav");if(!nav)return;
  nav.innerHTML=tableList().map(function(t){
    return '<button class="rn'+(S.refSel===t.key?' on':'')+'" data-ra="sel" data-k="'+esc(t.key)+'"><span>'+esc(t.name)+'</span><small>'+t.rows.filter(function(r){return r.active!==false}).length+'</small></button>';
  }).join("")+'<button class="rn add'+(S.refSel==="__new"?' on':'')+'" data-ra="sel" data-k="__new">+ New table</button>';
}
function newTableHTML(){
  return '<h2>New table</h2><p class="hint">Name the table and list its fields in the order you want them. The first field identifies each row, so keep it unique, such as a site code.</p>'+
    '<form id="tform" style="display:flex;flex-direction:column;gap:14px;max-width:520px">'+
    '<label class="fld">Table name<input id="tName" maxlength="40" placeholder="Sites" autocomplete="off"></label>'+
    '<label class="fld">Fields<input id="tFields" maxlength="200" placeholder="Site code, Site name, Region, Province" autocomplete="off"><small>Separate fields with commas. Up to 8. You can add more later.</small></label>'+
    '<label class="chk" style="padding:0"><input type="checkbox" id="tLink" checked> Use on tickets: the first field becomes the dropdown and the others fill in automatically</label>'+
    '<div class="row-end"><button class="btn primary" type="submit">Create table</button></div></form>';

function setProg(){
  var im=S.imp;if(!im)return;
  var b=im.kind==="upgrade"?$("#upgBtn"):im.kind==="import"?$("#doImpBtn"):null;
  if(b){b.disabled=true;b.textContent=(im.kind==="upgrade"?"Upgrading ":"Importing ")+im.done+" of "+im.total+"…"}
}
function renderRefPane(){
  var pane=$("#refPane");if(!pane)return;
  var ae=document.activeElement;
  if(ae&&pane.contains(ae)&&ae.hasAttribute("data-cell"))return;
  var keep={},activeId=ae&&pane.contains(ae)?ae.id:"",same=pane.dataset.k===S.refSel;
  pane.querySelectorAll("input[data-fid],#fnew,#impText").forEach(function(i){keep[i.id]=i.value});
  var impOpen=same&&$("#impBox")&&!$("#impBox").hidden;
  pane.dataset.k=S.refSel;
  if(S.refSel==="__new"){pane.innerHTML=newTableHTML();return}
  var t=tbl(S.refSel);
  if(!t){S.refSel="categories";t=tbl("categories");pane.dataset.k="categories"}
  var custom=!t.sys,h='',im=S.imp&&S.imp.key===t.key?S.imp:null;
  h+='<div class="ph"><div>'+(custom?'<input class="tname" id="rName" value="'+esc(t.name)+'" aria-label="Table name" maxlength="40">':'<h2>'+esc(t.name)+'</h2>')+'<p class="hint">'+esc(refHint(t))+'</p></div>'+
    (custom?'<button class="btn danger" data-ra="tdel">Delete table</button>':'')+'</div>';
  if(custom&&!t.big){
    h+='<div class="upg"><p><b>Upgrade storage to add more rows.</b> This table uses the original storage, which stops at about 1,400 rows ('+t.rows.length+' so far). Upgrading copies every row into the new storage and keeps each row’s ID, so existing tickets are not affected. It takes about a minute per 1,000 rows. Keep this page open until it finishes.</p>'+
      '<button class="btn primary" id="upgBtn" data-ra="upgrade"'+(im&&im.kind==="upgrade"?' disabled':'')+'>'+(im&&im.kind==="upgrade"?'Upgrading '+im.done+' of '+im.total+'…':'Upgrade storage')+'</button></div>';
  }
  if(custom){
    h+='<label class="chk" style="padding:0"><input type="checkbox" id="rLink"'+(t.link?' checked':'')+'> Use on tickets: the first field becomes the dropdown, the other fields fill in automatically, and the dashboard breaks down by them</label>';
    h+='<div class="chips">'+t.fields.map(function(f){
      return '<span class="chip">'+esc(f.label)+(t.fields.length>1?'<button data-ra="fdel" data-f="'+esc(f.id)+'" aria-label="Remove field '+esc(f.label)+'">×</button>':'')+'</span>';
    }).join("")+'<form class="refadd" data-form="fadd"><label class="sr" for="fnew">New field</label><input id="fnew" maxlength="40" placeholder="Add a field, e.g. Province" autocomplete="off"><button class="btn" type="submit">Add field</button></form></div>';
  }
  if(t.key==="team")h+='<p class="hint">Role decides what a person can do: '+ROLES.map(function(r){return '<b>'+r+'</b> — '+ROLE_NOTE[r.toLowerCase()].replace(/\.$/,"").toLowerCase()}).join("; ")+'. People sign in with the email listed here, and that email is locked to their account. Anyone with Editor access to this page is always an Admin, so you can’t lock yourself out. Set <b>Notify on new tickets</b> to Yes for Observers who should be alerted when a ticket is raised: they see a “New tickets” alert when they open Issue Desk, and whoever raises the ticket gets a one-click email to those observers.</p>';
  h+='<form class="radd" data-form="radd">'+t.fields.map(function(f){
    if(t.key==="team"&&f.id==="notify")return '<label class="sr" for="rv-notify">Notify on new tickets</label><select id="rv-notify" data-fid="notify">'+notifyOpts("")+'</select>';
    if(t.key==="team"&&f.id==="role")return '<label class="sr" for="rv-role">Role</label><select id="rv-role" data-fid="role">'+roleOpts("")+'</select>';

  }).join("")+'<button class="btn primary" type="submit">Add row</button></form>';

  pane.innerHTML=h;

function renderRefRows(t){
  var box=$("#rtab"),pager=$("#rpager"),cnt=$("#rcount");
  if(!box||!t)return;

async function mutate(key,fn){
  if(busy||!db||!S.canEdit)return false;
  var base=tbl(key);if(!base)return false;
  var t=base.big?{key:base.key,sys:false,big:true,name:base.name,fields:JSON.parse(JSON.stringify(base.fields)),link:!!base.link,order:base.order||0,rows:[]}:JSON.parse(JSON.stringify(base));
  if(fn(t)===false)return false;
  busy=true;
  try{
    if(base.big)await db.doc("ref/"+key).update({name:t.name,fields:t.fields,link:!!t.link});
    else{
      var doc={kind:"table",sys:!!t.sys,name:t.name,fields:t.fields,rows:t.rows,link:!!t.link,order:t.order||0};
      if(JSON.stringify(doc).length>240000){busy=false;toast(t.sys?"This list is too large to save. Remove entries you no longer need.":"This table has reached the size limit of the original storage. Use Upgrade storage at the top of the table to add more rows.",6000);return false}
      await db.doc("ref/"+key).set(doc);
    }
  }catch(e){writeError(e);busy=false;return false}
  busy=false;return true;
}
async function runPool(items,fn,onProgress){
  var i=0,done=0,failed=0,err=null,stop=false;
  async function worker(){
    while(!stop&&i<items.length){
      var it=items[i++],tries=0;
      for(;;){
        try{await fn(it);done++;break}
        catch(e){
          if(e&&e.code==="resource_exhausted"&&tries<6){tries++;await sleep(300*Math.pow(2,tries));continue}
          failed++;err=err||e;
          if(e&&(e.code==="quota_exceeded"||e.code==="revoked"||e.code==="invalid_argument"))stop=true;
          break;
        }
      }
      if(onProgress)onProgress(done+failed);
    }
  }
  var ws=[];for(var w=0;w<8;w++)ws.push(worker());
  await Promise.all(ws);
  return {done:done,failed:failed,err:err};
}

async function doImport(){
  var t=tbl(S.refSel);if(!t||S.imp)return;
  var lines=$("#impText").value.split(/\r?\n/).filter(function(l){return l.trim()});
  if(!lines.length){toast("Paste at least one row.");return}
  if(isBig(t)&&!S.rowsReady[t.key]){toast("Rows are still loading. Try again in a moment.");return}
  var f0=t.fields[0],seen={},emails={},rowsNew=[],skipped=0;
  t.rows.forEach(function(r){
    var k=String((r.v&&r.v[f0.id])||"").trim().toLowerCase();if(k)seen[k]=1;
    if(t.key==="team"&&r.v&&r.v.email)emails[String(r.v.email).toLowerCase()]=1;
  });
  lines.forEach(function(line,idx){
    var cells=(line.indexOf("\t")>=0?line.split("\t"):line.split(",")).map(function(c){return c.trim().replace(/^"(.*)"$/,"$1")});
    if(idx===0&&cells[0].toLowerCase()===f0.label.toLowerCase())return;

      v.email=v.email.toLowerCase();

    return;
  }

  var res=await runPool(rowsNew,function(r){return rowDoc(t.key,r.id).set({v:r.v,active:true})},function(n){S.imp.done=n;setProg()});
  S.imp=null;
  var left=rowsNew.length-res.done;
  if(!left){
    var tx=$("#impText"),bx=$("#impBox");if(tx)tx.value="";if(bx)bx.hidden=true;
    toast("Imported "+res.done+(res.done===1?" row":" rows")+skipNote+".",6000);
  }else if(res.err&&res.err.code==="quota_exceeded"){
    toast("Imported "+res.done+" of "+rowsNew.length+" rows. The page has reached its limit of 25,000 records. Remove old tickets or rows, then paste the rest; rows already added are skipped.",10000);
  }else{
    toast("Imported "+res.done+" of "+rowsNew.length+" rows. Paste the same rows again to add the rest; rows already added are skipped.",10000);
  }
  renderRefPane();
}

function cbOpen(inp,q){

  if(tb.big&&!S.rowsReady[tb.key]){ul.innerHTML='<li class="cbn">Loading…</li>';ul.hidden=false;inp.setAttribute("aria-expanded","true");return}
  var all=cbMatches(tb,q),shown=all.slice(0,CB_MAX),f0=tb.fields[0].id,f1=tb.fields[1]&&tb.fields[1].id;
  cbState={id:inp.id,items:shown,active:shown.length?0:-1};
  ul.innerHTML=shown.map(function(r,i){
    var sub=f1?((r.v&&r.v[f1])||""):"";
    return '<li role="option" id="'+inp.id+'-o'+i+'" data-i="'+i+'"'+(i===0?' class="on" aria-selected="true"':'')+'><b>'+esc((r.v&&r.v[f0])||"")+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</li>';
  }).join("")+
  (!shown.length?'<li class="cbn">No match. Check the code, or try part of the name.</li>':'')+
  (all.length>CB_MAX?'<li class="cbn">'+(all.length-CB_MAX)+' more. Keep typing to narrow the list.</li>':'');
  ul.hidden=false;inp.setAttribute("aria-expanded","true");
  if(shown.length)inp.setAttribute("aria-activedescendant",inp.id+"-o0");else inp.removeAttribute("aria-activedescendant");
}
function cbClose(inp){
  var ul=$("#"+inp.id+"-lb");if(ul)ul.hidden=true;
  inp.setAttribute("aria-expanded","false");inp.removeAttribute("aria-activedescendant");
  cbState={id:"",items:[],active:-1};
}
function cbIsOpen(inp){var ul=$("#"+inp.id+"-lb");return !!ul&&!ul.hidden}
function cbMove(inp,d){
  var n=cbState.items.length;if(!n)return;
  cbState.active=(cbState.active+d+n)%n;
  var ul=$("#"+inp.id+"-lb");
  ul.querySelectorAll("li[data-i]").forEach(function(li){
    var on=+li.dataset.i===cbState.active;
    li.classList.toggle("on",on);if(on){li.setAttribute("aria-selected","true");inp.setAttribute("aria-activedescendant",li.id);li.scrollIntoView({block:"nearest"})}else li.removeAttribute("aria-selected");
  });
}
function cbSelect(inp){return $("#"+inp.dataset.px+"L-"+inp.dataset.cb)}
function cbPick(inp,i){
  var tb=S.tables[inp.dataset.cb],r=cbState.items[i],sel=cbSelect(inp);
  if(!tb||!r||!sel)return;
  sel.value=r.id;
  if(sel.value!==r.id){var op=document.createElement("option");op.value=r.id;op.textContent=(r.v&&r.v[tb.fields[0].id])||"";sel.appendChild(op);sel.value=r.id}
  inp.value=(r.v&&r.v[tb.fields[0].id])||"";
  cbClose(inp);
  sel.dispatchEvent(new Event("change",{bubbles:true}));
}
function cbRevert(inp){
  var sel=cbSelect(inp);if(!sel)return;
  var txt=inp.value.trim();
  if(!txt&&sel.value){sel.value="";sel.dispatchEvent(new Event("change",{bubbles:true}));return}
  var o=sel.selectedIndex>=0?sel.options[sel.selectedIndex]:null;
  inp.value=(sel.value&&o)?o.text:"";
}
function linkText(t){
  var ls=t.links||{};
  return Object.keys(ls).map(function(k){
    var l=ls[k]||{},v=l.values||{};
    return (l.label||"")+" "+Object.keys(v).map(function(f){return v[f]}).join(" ");
  }).join(" ");
}
document.addEventListener("focusin",function(e){
  var el=e.target;if(!el.classList||!el.classList.contains("cbi"))return;
  el.select();cbOpen(el,"");
});

document.addEventListener("focusout",function(e){
  var el=e.target;if(!el.classList||!el.classList.contains("cbi"))return;

document.addEventListener("mousedown",function(e){
  var li=e.target.closest&&e.target.closest(".cbl li[data-i]");if(!li)return;

document.addEventListener("keydown",function(e){
  var el=e.target;if(!el.classList||!el.classList.contains("cbi"))return;
  var open=cbIsOpen(el);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    if(!open)cbOpen(el,el.value===""?"":"");else cbMove(el,e.key==="ArrowDown"?1:-1);
  }else if(e.key==="Enter"){
    if(open&&cbState.active>=0){e.preventDefault();cbPick(el,cbState.active)}
    else if(open)e.preventDefault();
  }else if(e.key==="Escape"&&open){
    e.preventDefault();e.stopImmediatePropagation();cbClose(el);cbRevert(el);
  }
});

    return;
  }
  var nowMs=Date.now()+60000,cbo=t.createdBy||{};
  var prev={dRaised:toLocalInput(rsd(t)),dEndorsed:toLocalInput(t.endorsedAt),dClosed:toLocalInput(t.closedAt),dAssigneeEmail:t.assigneeEmail||"",dAssignee:t.assignee||"",dByName:cbo.name||S.names[t.reporter]||"",dByEmail:cbo.email||"",dCloseName:(t.closedBy&&t.closedBy.name)||"",dCloseEmail:(t.closedBy&&t.closedBy.email)||""};
  function withActs(pt){

  function revert(msg){toast(msg,5000);if(id in prev)el.value=prev[id]}

document.addEventListener("submit",async function(e){

  if(e.target.id==="cform"){
    var ta=$("#cText"),txt=ta.value.trim();if(!txt)return;
    busy=true;
    try{await postComment(txt);ta.value=""}catch(err){writeError(err)}
    busy=false;
  }else if(e.target.dataset&&e.target.dataset.form==="radd"){
    await addRow(e.target);
  }else if(e.target.dataset&&e.target.dataset.form==="fadd"){
    await addField(e.target);
  }else if(e.target.id==="tform"){
    await createTable();
  }else if(e.target.id==="nform"){
    var desc=$("#nDesc").value.trim();
    if(!desc){$("#nErr").hidden=false;$("#nDesc").focus();return}
    if(!$("#nCategory").value){$("#nCatErr").hidden=false;$("#nCategory").focus();return}

    var miss=Array.prototype.filter.call(document.querySelectorAll("[data-nl][data-req]"),function(x){return !x.value})[0];
    if(miss){var me2=$("#nLe-"+miss.dataset.nl);if(me2)me2.hidden=false;var qq=$("#nQ-"+miss.dataset.nl);(qq||miss).focus();return}
    ["nRaisedErr","nEndErr","nByNameErr","nByEmailErr","nAsgEmailErr","nClosedErr","nCloseNameErr","nCloseEmailErr"].forEach(function(x){var er=$("#"+x);if(er)er.hidden=true});
    if(!P("raise"))return toast("Your role can't raise tickets.");
    var adm=isAdm();
    var lim=Date.now()+60000,rM=fromLocalInput($("#nRaised").value),eM=fromLocalInput($("#nEndorsed").value),cM=adm?fromLocalInput($("#nClosed").value):null;
    var byName=adm?$("#nByName").value.trim():(S.who.name||S.who.email),byEmail=adm?$("#nByEmail").value.trim().toLowerCase():S.who.email;
    var asgName=$("#nAssignee").value.trim(),asgEmail=$("#nAssigneeEmail").value.trim().toLowerCase();
    if(!rM)return fieldErr("nRaised","nRaisedErr","Enter when the issue was raised.");
    if(rM>lim)return fieldErr("nRaised","nRaisedErr","The raised time can't be in the future.");
    if(!byName)return fieldErr("nByName","nByNameErr","Enter who is raising this ticket.");
    if(!validEmail(byEmail))return fieldErr("nByEmail","nByEmailErr","Enter a valid email address.");
    if(!validEmail(asgEmail))return fieldErr("nAssigneeEmail","nAsgEmailErr","Enter a valid email address.");
    if(asgEmail&&!asgName)return fieldErr("nAssignee","nAsgEmailErr","Add the assignee's name too.");
    if(eM&&eM<rM)return fieldErr("nEndorsed","nEndErr","The endorsed time can't be before the raised time.");
    if(eM&&eM>lim)return fieldErr("nEndorsed","nEndErr","The endorsed time can't be in the future.");
    if(cM&&cM<rM)return fieldErr("nClosed","nClosedErr","The closed time can't be before the raised time.");
    if(cM&&cM>lim)return fieldErr("nClosed","nClosedErr","The closed time can't be in the future.");
    var kName=adm?$("#nCloseName").value.trim():"",kEmail=adm?$("#nCloseEmail").value.trim().toLowerCase():"";
    if(cM&&!kName)return fieldErr("nCloseName","nCloseNameErr","Enter who closed it.");
    if(!cM&&(kName||kEmail))return fieldErr("nClosed","nClosedErr","Add the closed time, or clear the closed-by fields.");
    if(!validEmail(kEmail))return fieldErr("nCloseEmail","nCloseEmailErr","Enter a valid email address.");
    busy=true;var go=$("#nGo");go.disabled=true;go.textContent="Raising…";

      nbarShow(label,desc,$("#nCategory").value,$("#nPriority").value,byName);if(adm)lsSet({name:byName,email:byEmail});closeDrawer();toast(label+" raised.");
    }catch(err){writeError(err);go.disabled=false;go.textContent="Raise ticket"}
